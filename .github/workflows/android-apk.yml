name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Generar proyecto Android (Expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_OFFLINE: 1

      - name: Compilar APK (release, firmado con la clave de depuración)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Anota.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anota-apk
          path: Anota.apk

      # Publica el APK en una Release fija para tener un enlace de descarga directo:
      # https://github.com/<usuario>/<repo>/releases/download/apk-latest/Anota.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Anota (última compilación)
          body: |
            APK de Anota compilado automáticamente desde `${{ github.ref_name }}` (${{ github.sha }}).
            Descarga **Anota.apk**, ábrelo en el móvil y permite «Instalar apps desconocidas».
          prerelease: false
          make_latest: true
          files: Anota.apk
